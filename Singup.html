<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="SingUp.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="icons/MainLogo.svg" alt="Logo"> <!-- Replace with the actual path to your logo image -->
        </div>
        <h1>Регистрация</h1>
        <form>
            <input type="text" placeholder="Логин" required>
            <input type="email" placeholder="name@example.com" required>
            <div class="password-field">
                <input type="password" placeholder="Пароль" required>
                <button type="button" class="toggle-password">👁️</button> <!-- Optional: Add JavaScript to toggle password visibility -->
            </div>
            <button type="submit" class="register-button">Зарегистрироваться</button>
        </form>
        <div class="login-link">
            <p>Уже есть аккаунт?</p>
            <a href="regestration.html">Войти</a>
        </div>
    </div>
</body>
</html>
